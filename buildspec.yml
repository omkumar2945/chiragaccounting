version: 0.2

# Backend CodeBuild project. Set IMAGE_REPOSITORY_URI to the target ECR
# repository URI; a downstream ECS deployment stage consumes imagedefinitions.
env:
  variables:
    AWS_REGION: ap-south-1

phases:
  pre_build:
    commands:
      - test -n "$IMAGE_REPOSITORY_URI"
      - export IMAGE_TAG="${IMAGE_TAG:-${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}}"
      - export IMAGE_URI="$IMAGE_REPOSITORY_URI:$IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${IMAGE_REPOSITORY_URI%/*}"
  build:
    commands:
      - docker build --tag "$IMAGE_URI" -f backend/Dockerfile backend
  post_build:
    commands:
      - docker push "$IMAGE_URI"
      - printf '[{"name":"chirag-command-center-backend","imageUri":"%s"}]' "$IMAGE_URI" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json